<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{ subject }}</title>
<style>
  /* Layout and colours are inline (Gmail and Outlook drop most of <style>). These rules only
     add phone sizing and dark mode for the apps that support them (Apple Mail, iOS, Outlook.com). */
  body { margin: 0; padding: 0; }
  @media (max-width: 540px) {
    .wrap { padding: 20px 10px !important; }
    .body { padding: 30px 22px 28px !important; }
    .h1 { font-size: 24px !important; }
    .code { font-size: 30px !important; letter-spacing: 8px !important; }
    .hero { padding: 26px 22px !important; }
  }
  @media (prefers-color-scheme: dark) {
    .page { background: #0b1120 !important; }
    .card { background: #121a2e !important; border-color: #1f2a44 !important; }
    .h1, .strong { color: #f1f5ff !important; }
    .text { color: #b7c3dc !important; }
    .muted { color: #7d8aa6 !important; }
    .codebox { background: #1a2440 !important; border-color: #2c3b62 !important; }
    .code { color: #9cc0ff !important; }
    .panel { background: #172036 !important; border-color: #24304d !important; }
    .alert { background: #2a2414 !important; border-color: #4d4122 !important; color: #f0dfb4 !important; }
    .chip { background: #1e2a48 !important; }
    .rule { border-color: #1f2a44 !important; }
  }
</style>
</head>
<body class="page" style="margin:0;padding:0;background:#eef2f9;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <!-- Inbox preview line -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;mso-hide:all;">{{ preheader }}&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="page" style="background:#eef2f9;">
    <tr>
      <td align="center" class="wrap" style="padding:36px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">

          <!-- Card -->
          <tr>
            <td class="card" style="background:#ffffff;border:1px solid #e3e9f4;border-radius:28px;overflow:hidden;box-shadow:0 18px 40px rgba(31,58,110,0.10);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

              <!-- Header band -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="hero" bgcolor="#2f6fd6" style="background:#2f6fd6;background-image:linear-gradient(135deg,#1f4fb3 0%,#2f6fd6 45%,#5b9bff 100%);padding:28px 36px;border-radius:28px 28px 0 0;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="40" height="40" valign="middle" style="width:40px;height:40px;"><img src="{{ icons }}logo.png" width="40" height="40" alt="To-Do" style="display:block;width:40px;height:40px;border:0;border-radius:11px;"></td>
                        <td style="padding-left:12px;font:800 19px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#ffffff;letter-spacing:-0.2px;">To-Do</td>
                      </tr>
                    </table>
                    {% block hero %}{% endblock %}
                  </td>
                </tr>
              </table>

              <!-- Body -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="body" style="padding:36px 40px 34px;">
                    {% block content %}{% endblock %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" class="muted" style="padding:24px 24px 0;font:400 12px/1.7 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#8a97ad;">
              {% block footer %}You're getting this because this address was used on To-Do.{% endblock %}<br>
              <span style="color:#a3aec2;">To-Do &middot; your day on a clock &middot; todoclock.app</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

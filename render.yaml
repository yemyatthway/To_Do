# Render Blueprint: Dashboard → New → Blueprint → pick this repo. Secrets marked `sync: false`
# are asked for once when you create it (see README → Deploying).
services:
  - type: web
    name: to-do-api
    runtime: python
    plan: free
    # Closest Render region to the Supabase database (Mumbai), so each query is a short hop.
    region: singapore
    rootDir: server
    buildCommand: pip install uv && uv sync --frozen && uv run python manage.py collectstatic --noinput && uv run python manage.py migrate --noinput
    startCommand: uv run gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TRUSTED_FRONTEND_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
